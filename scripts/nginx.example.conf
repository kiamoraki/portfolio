# Example Nginx config for serving out/ on kiamoraki.com.
# Drop in /etc/nginx/sites-available/kiamoraki.com on the server, symlink to sites-enabled,
# then `nginx -t && systemctl reload nginx`.
# Run `certbot --nginx -d kiamoraki.com -d www.kiamoraki.com` separately to get an SSL cert.

server {
    listen 80;
    listen [::]:80;
    server_name kiamoraki.com www.kiamoraki.com;

    # Web root — wherever scripts/deploy.sh rsyncs to.
    root /var/www/kiamoraki.com;
    index index.html;

    # trailingSlash:true in next.config.ts means routes are directories with index.html.
    # try_files handles both bare paths and the static export's directory layout.
    location / {
        try_files $uri $uri/ $uri.html $uri/index.html =404;
    }

    # Long-cache hashed assets (JS/CSS bundles)
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Long-cache the image library (sources never change once published)
    location /img/ {
        expires 30d;
        add_header Cache-Control "public";
    }

    # Long-cache fonts
    location /fonts/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Custom 404
    error_page 404 /404.html;

    # Hide the manifest text artifacts Next.js emits
    location ~ /__next\..*\.txt$ { deny all; }
}

# After certbot runs, it will rewrite the above into HTTPS. Or do it manually:
#
# server {
#     listen 443 ssl http2;
#     listen [::]:443 ssl http2;
#     server_name kiamoraki.com www.kiamoraki.com;
#     ssl_certificate     /etc/letsencrypt/live/kiamoraki.com/fullchain.pem;
#     ssl_certificate_key /etc/letsencrypt/live/kiamoraki.com/privkey.pem;
#     ... (root, location blocks same as above)
# }
#
# server {
#     listen 80;
#     server_name kiamoraki.com www.kiamoraki.com;
#     return 301 https://$host$request_uri;
# }
